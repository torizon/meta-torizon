# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-torizon"
BBFILE_PATTERN_meta-torizon := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-torizon = "90"

LAYERDEPENDS_meta-torizon = "sota virtualization-layer"
LAYERSERIES_COMPAT_meta-torizon = "wrynose"
