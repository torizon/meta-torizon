# Torizon OS does not ship GNU coreutils from version 8 onwards, so busybox provides those
# commands instead. The oe-core defconfig already covers most of them; enable
# the remaining applets that busybox implements so the command set stays as
# close as possible to coreutils.
CONFIG_BB_ARCH=y
CONFIG_BASE64=y
CONFIG_CKSUM=y
CONFIG_COMM=y
CONFIG_EXPAND=y
CONFIG_FACTOR=y
CONFIG_FOLD=y
CONFIG_HOSTID=y
CONFIG_INSTALL=y
CONFIG_FEATURE_INSTALL_LONG_OPTIONS=y
CONFIG_LINK=y
CONFIG_NICE=y
CONFIG_NL=y
CONFIG_PASTE=y
CONFIG_PRINTENV=y
CONFIG_SHA512SUM=y
CONFIG_SHRED=y
CONFIG_SPLIT=y
CONFIG_FEATURE_SPLIT_FANCY=y
CONFIG_SUM=y
CONFIG_TAC=y
CONFIG_TIMEOUT=y
CONFIG_TRUNCATE=y
CONFIG_TSORT=y
CONFIG_UNEXPAND=y
# Accept the obsolete "head -N" syntax, which scripts written for coreutils use.
CONFIG_FEATURE_FANCY_HEAD=y
# dd: accept ibs/obs/conv/iflag/oflag and status=, used by the bootloader
# update handler (iflag=skip_bytes,count_bytes) and other scripts.
CONFIG_FEATURE_DD_IBS_OBS=y
CONFIG_FEATURE_DD_STATUS=y
